<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Страница хранит ключ Claude в браузере, поэтому разрешаем только свои скрипты и известные адреса. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://upload.wikimedia.org; font-src 'self'; connect-src 'self' https://api.anthropic.com https://*.wikipedia.org https://www.wikidata.org https://nominatim.openstreetmap.org https://routing.openstreetmap.de; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Истории рядом</title>
  <meta name="description" content="Откройте на улице: приложение найдёт, что интересного вокруг, и расскажет истории об этих местах. Для взрослых и для детей, голосом или текстом.">
  <meta name="theme-color" content="#173a8c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Истории">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="app"></main>
  <noscript>Для работы приложения нужен JavaScript.</noscript>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
